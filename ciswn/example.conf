# Arguments are whitespace-separated; quote syntax is intentionally unsupported.
shutdown_timeout 3

# service NAME MODE RESTART MAX_RESTARTS RESTART_DELAY EXECUTABLE [ARG ...]
service prepare-runtime oneshot never 0 0 /bin/true
service logger simple on-failure 3 1 /usr/bin/logger -t kelpos-init
service shell simple never 0 0 /bin/sleep 30

# after SERVICE DEPENDENCY
after logger prepare-runtime
after shell logger